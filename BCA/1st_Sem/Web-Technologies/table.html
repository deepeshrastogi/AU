<!DOCTYPE html>
<html>
<head>
    <title>Table with Colspan and Rowspan</title>
</head>
<body>

<h2>Student Details</h2>

<table border="1" width="100%" cellpadding="8" cellspacing="0">

    <!-- Table Title -->
    <tr>
        <th colspan="5">Student Information</th>
    </tr>

    <!-- Header -->
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Course</th>
    </tr>

    <!-- Normal Row -->
    <tr>
        <td>1</td>
        <td>Amit</td>
        <td>amit@gmail.com</td>
        <td>9898778787</td>
        <td>MCA</td>
    </tr>

    <!-- Rowspan Example -->
    <tr>
        <td rowspan="2">2</td>
        <td>Ravi</td>
        <td>ravi@gmail.com</td>
        <td>9855778743</td>
        <td>BCA</td>
    </tr>

    <tr>
        <td>Ravi Kumar</td>
        <td>ravikumar@gmail.com</td>
        <td>9876543210</td>
        <td>BCA</td>
    </tr>

    <!-- Normal Row -->
    <tr>
        <td>3</td>
        <td>Lata</td>
        <td>lata@gmail.com</td>
        <td>9898778454</td>
        <td>BBA</td>
    </tr>

    <!-- Colspan Example -->
    <tr>
        <td>4</td>
        <td>Mohit</td>
        <td colspan="3">MBA Student - Email and Phone Not Available</td>
    </tr>

</table>

</body>
</html>
